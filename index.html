<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind the Troll Memory Game</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
</head>
<body>

    <header>

        <h1>Mind the Troll</h1>
    
    </header>

    <main>

        <!-- HUD Info -->
        <section class="hud">

            <div class="hud-bar">

                <!--Matches-->
                <div class="hud-item"> 

                    <p>Matches: <span id="matches">0</span>/6</p>

                </div>

                <!--Wrong Guesses Left-->
                <div class="hud-item">

                    <p>Wrong Guesses Left: <span id="guesses-left">6</span></p>

                </div>

                <!--Reset Button-->
                <div class="hud-actions">

                    <button id="reset-btn" class="btn" type="button">Reset</button>

                </div>

             </div>
                
             <!--Messages-->
            <div class="hud-message">

                <p class="message" id="message">Flip two cards. Match all 6 pairs to cross the bridge. You have <strong>6</strong> wrong guesses before the troll eats you.</p>
                
            </div>

        </section>

        <!--Game Board-->
        <section class="game-area">
            <div id="board">
                <div class="card">A</div>
                <div class="card">B</div>
                <div class="card">C</div>
                <div class="card">D</div>
                <div class="card">E</div>
                <div class="card">F</div>
                <div class="card">A</div>
                <div class="card">B</div>
                <div class="card">C</div>
                <div class="card">D</div>
                <div class="card">E</div>
                <div class="card">F</div>
            </div>
        </section>

    </main>

</body>

</html>
